# Provisório: nome do app e do host mudam junto com o nome do projeto.
app = "tucupass"
primary_region = "gru"
kill_signal = "SIGTERM"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "tucupass.fly.dev"
  PORT = "8080"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  # Segredos (fly secrets set): SECRET_KEY_BASE, DATABASE_URL, ORGANIZER_KEY, RESEND_API_KEY

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/"
